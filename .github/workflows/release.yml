name: Build and release APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Validate and package web app
        run: |
          npm test
          node scripts/package-web.js
          node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+p.version) throw Error('Tag must match package version')"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build and review Android
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android testReleaseUnitTest lintRelease assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test offline app and persisted orders on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest --no-daemon
      - name: Prepare release files
        run: |
          mkdir release
          cp android/app/build/outputs/apk/release/app-release.apk release/little-a-orders.apk
          cd dist && zip -r ../release/little-a-orders-web.zip . && cd ..
          cd release && sha256sum little-a-orders.apk little-a-orders-web.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: little-a-orders
          path: release/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "小A點餐 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
      - name: Remove ephemeral signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
