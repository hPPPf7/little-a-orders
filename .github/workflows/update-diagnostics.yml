name: Verify published APK update prompt
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the actual published old APK
        run: curl --fail --location --retry 3 -o old.apk https://github.com/hPPPf7/little-a-orders/releases/download/v1.0.2/little-a-orders.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          script: bash scripts/check-published-update.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-update-diagnostics
          path: diagnostics/
