plugins { id 'com.android.application' }
def packageInfo = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def parts = packageInfo.version.tokenize('.').collect { it.toInteger() }
android {
 namespace 'tw.littlea.orders'
 compileSdk 35
 defaultConfig {
  applicationId 'tw.littlea.orders'
  minSdk 28
  targetSdk 35
  versionCode parts[0]*10000 + parts[1]*100 + parts[2]
  versionName packageInfo.version
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 signingConfigs {
  release {
   if (System.getenv('ANDROID_KEYSTORE')) {
    storeFile file(System.getenv('ANDROID_KEYSTORE'))
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias 'little-a'
    keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.core:core:1.15.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:rules:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
